components:
  schemas:
    AccessDenials:
      type: object
      properties:
        byAction:
          type: array
          items:
            $ref: "#/components/schemas/ActionCount"
        total:
          type: integer
          format: int64
    ActionCount:
      type: object
      properties:
        action:
          type: string
        count:
          type: integer
          format: int64
    Adoption:
      type: object
      properties:
        activeUsers:
          type: integer
          format: int64
        askedUsers:
          type: integer
          format: int64
        questions:
          type: integer
          format: int64
    AnswerQuality:
      type: object
      properties:
        assistantMessages:
          type: integer
          format: int64
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        ok:
          type: integer
          format: int64
        okWithSources:
          type: integer
          format: int64
        withSources:
          type: integer
          format: int64
    AuditEntry:
      type: object
      properties:
        action:
          type: string
        actorId:
          type: integer
          format: int64
        actorName:
          type: string
        correlationId:
          type: string
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
        result:
          type: string
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
    AuditRequest:
      type: object
      properties:
        action:
          type: string
          minLength: 1
        actorId:
          type: integer
          format: int64
        allowed:
          type: boolean
        reason:
          type: string
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
      required:
      - action
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 100
          minLength: 8
      required:
      - currentPassword
      - newPassword
    ComponentHealth:
      type: object
      properties:
        latencyMs:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
          - UNKNOWN
    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - name
    CreateUserAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        name:
          type: string
          maxLength: 100
          minLength: 0
        organizationId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
            enum:
            - SYSTEM_ADMIN
            - ORG_ADMIN
            - TEAM_ADMIN
            - MEMBER
          minItems: 1
        teamIds:
          type: array
          items:
            type: integer
            format: int64
      required:
      - email
      - name
      - organizationId
      - roles
    CurrentUser:
      type: object
      properties:
        email:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        organizationId:
          type: integer
          format: int64
        organizationName:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDto"
    DlqActionRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - ids
    DlqActionResult:
      type: object
      properties:
        failedIds:
          type: array
          items:
            type: string
        succeeded:
          type: integer
          format: int32
    DlqEntry:
      type: object
      properties:
        addedAt:
          type: string
          format: date-time
        consumerGroup:
          type: string
        deliveries:
          type: integer
          format: int32
        id:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
        reason:
          type: string
        sourceId:
          type: string
        sourceStream:
          type: string
        streamKey:
          type: string
    DlqStatus:
      type: object
      properties:
        consumerService:
          type: string
        count:
          type: integer
          format: int64
        dlqStream:
          type: string
        key:
          type: string
        oldestAt:
          type: string
          format: date-time
        stream:
          type: string
    Feedback:
      type: object
      properties:
        assistantMessages:
          type: integer
          format: int64
        helpful:
          type: integer
          format: int64
        notHelpful:
          type: integer
          format: int64
        responded:
          type: integer
          format: int64
    FeedbackItem:
      type: object
      properties:
        answerPreview:
          type: string
        answerStatus:
          type: string
        conversationId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        latencyMs:
          type: integer
          format: int32
        messageId:
          type: integer
          format: int64
        question:
          type: string
        raterName:
          type: string
        rating:
          type: string
        reason:
          type: string
        sourceCount:
          type: integer
