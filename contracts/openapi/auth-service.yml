openapi: 3.1.0
info:
  description: "로그인·JWT 발급, 사용자·조직·권한 관리, 감사, 운영 현황"
  title: auth-service API
  version: 0.1.0
servers:
- description: Generated server url
  url: http://localhost
paths:
  /.well-known/jwks.json:
    get:
      operationId: jwks
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
          description: OK
      tags:
      - auth-controller
  /api/access-policies:
    get:
      operationId: list_1
      parameters:
      - in: header
        name: X-User-Id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: includeRevoked
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePolicy"
          description: OK
      tags:
      - policy-controller
    post:
      operationId: create
      parameters:
      - in: header
        name: X-User-Id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
