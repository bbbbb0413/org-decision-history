server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA 라우팅. 정적 파일이 없으면 index.html 로 되돌린다.
    # API 호출은 프론트가 게이트웨이를 직접 호출한다 (VITE_GATEWAY_URL). /api 프록시는 두지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
