# 비밀정보·개인정보 마스킹 규칙(app/security/pii_scanner.py). 걸린 부분을 [REDACTED_<id>] 로 바꾼다.
# 위에서부터 차례로 적용한다. 마스킹 로그에는 규칙 id 만 남기고 값은 남기지 않는다.
#
# 규칙마다 should_match·should_not_match 를 두고 tests/test_security_rules.py 가 전부 돌린다(이 규칙 하나만으로).
# 운영에서 덮어쓰려면 SECURITY_RULES_PATH 에 이 파일과 같은 이름의 파일이 있는 디렉터리를 준다.
rules:
  - id: AWS_KEY
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    should_match: ["AWS 키는 AKIA1234567890ABCDEF 입니다"]
    should_not_match: ["AKIA 로 시작하는 키 형식은?"]

  - id: GITHUB_TOKEN
    pattern: '\bgh[pousr]_[A-Za-z0-9_]{36,255}\b'
    should_match: ["ghp_abcdefghijklmnopqrstuvwxyz0123456789"]
    should_not_match: ["ghp_ 토큰 발급 절차"]

  - id: OPENAI_KEY
    pattern: '\bsk-[a-zA-Z0-9]{20,}\b'
    should_match: ["sk-abcdefghijklmnopqrstuvwx"]
    should_not_match: ["sk-telecom 회선 신청"]

  - id: JWT_TOKEN
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]+\b'
    should_match: ["토큰 eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.sig 입니다"]
    should_not_match: ["eyJ 로 시작하는 문자열은 뭐야?"]

  - id: KR_RRN
    pattern: '\b\d{6}-[1-4]\d{6}\b'
    should_match: ["주민번호는 900101-1234567 입니다"]
    should_not_match: ["문서 번호 2026-03 회의록"]

  - id: CREDIT_CARD
    pattern: '\b(?:\d{4}-){3}\d{4}\b|\b(?:\d{4}\s){3}\d{4}\b'
    should_match: ["카드 1234-5678-9012-3456", "카드 1234 5678 9012 3456"]
    should_not_match: ["2026-04-01 시행"]

  - id: KR_PHONE
    pattern: '\b01[016789]-?\d{3,4}-?\d{4}\b'
    should_match: ["연락처는 010-1234-5678", "01012345678"]
    should_not_match: ["내선 1234"]

  - id: EMAIL
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    should_match: ["admin@company.com 으로 보내"]
    should_not_match: ["@멘션으로 알려줘"]
