spring:
  application:
    name: chat-service
  datasource:
    # chat 스키마를 먼저 찾고, 다른 서비스 소유 테이블은 스키마를 붙여 읽는다
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge?currentSchema=chat,public}
    username: ${SPRING_DATASOURCE_USERNAME:history}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_schema: chat
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: chat
    default-schema: chat
    create-schemas: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  kafka:
    # job 소비는 rag-service(Python)가 한다. chat-service 는 job 을 발행만 한다(AnswerJobProducer).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mvc:
    async:
      # SSE 연결 상한. chat.sse.timeout 과 같은 값을 쓴다(게이트웨이 응답 타임아웃 300초와 맞춘다)
      request-timeout: ${chat.sse.timeout:5m}

server:
  port: ${SERVER_PORT:8084}

# 운영 튜닝값(SseProperties·TimelineProperties). 기본값은 코드와 같고, 환경변수로 덮어쓴다(예: CHAT_SSE_TIMEOUT=10m)
chat:
  sse:
    timeout: 5m          # 앞단 프록시·게이트웨이 응답 타임아웃과 맞춘다
    heartbeat: 15s       # 프록시 idle 타임아웃보다 짧게
    stream-block: 5s     # POLL 전용
    # PUBSUB: 알림 구독 + XRANGE / POLL: job 마다 블로킹 XREAD 루프 — 롤백용 (CHAT_SSE_RELAY_MODE 로 바꾼다)
    relay-mode: PUBSUB
    drain-batch-size: 100
  timeline:
    conflict-ttl: 24h    # 상충 분석 캐시
    max-events: 30       # 타임라인 문서 수 — 상충 비교 LLM 호출 수를 정한다
    max-difference-length: 500

internal:
  api-key: ${INTERNAL_API_KEY:}

auth:
  service-url: ${AUTH_SERVICE_URL:http://localhost:8081}

# 권한 범위 캐시(common PermissionCacheProperties). 권한 변경은 최대 ttl 뒤에 반영된다
permission-cache:
  ttl: 10s
  max-entries: 10000

llm:
  # 상충 판정에만 쓴다. 비어 있으면 상태 비교만으로 판정한다.
  api-key: ${GROQ_API_KEY:}
  endpoint: https://api.groq.com
  # 무료 티어 한도. chat-service 의 경량 호출(타임라인 상충 판정)은 fallback-model 을 쓴다.
  primary-model: openai/gpt-oss-120b
  fallback-model: openai/gpt-oss-20b
  max-output-tokens: 1500

# OpenAPI 스펙 생성. `/v3/api-docs(.yaml)` 는 내부 키 필터 뒤에 있어
# 게이트웨이를 통해서는 닿지 않는다. 스펙 원본은 contracts/openapi 에 떠서 커밋한다.
springdoc:
  # 키 정렬을 켜야 엔드포인트가 추가돼도 스냅샷 diff 가 실제 변경만 보여준다
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # 여러 서비스를 한 Prometheus 로 긁을 때 시계열을 구분한다
      application: chat-service
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
